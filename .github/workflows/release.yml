name: release

# `make release VERSION=x.y.z` on main creates the tag; pushing it runs this.
# Everything below is mechanical: the decision was tagging.
on:
  push:
    tags: ['v*']

# id-token is what makes the signing keyless: the runner exchanges a short-lived
# OIDC token for a Sigstore certificate, and no private key exists to leak or
# rotate. Both signatures below depend on it.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches .version
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat .version)"
          # A tag that disagrees with .version ships a formula whose version
          # does not match what the plugin reports at runtime.
          [ "$tag" = "$file" ] || {
            echo "tag v$tag does not match .version ($file)"; exit 1; }
          echo "version=$tag" >> "$GITHUB_ENV"

      - name: Check the tag is signed
        run: |
          set -e
          # `make release` signs with git tag -s. An unsigned tag means the tag
          # object was written by something other than that path — the one signal
          # available here that the release was not cut as intended.
          git cat-file tag "$GITHUB_REF_NAME" | grep -qE 'BEGIN (SSH|PGP) SIGNATURE' || {
            echo "tag $GITHUB_REF_NAME is not signed; cut it with 'make release'"; exit 1; }

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: make check
        run: make check

      - name: Build the release tarball
        run: |
          set -e
          # git archive, so the tarball holds exactly what is tracked — the same
          # contents `make test-brew` builds against locally.
          git archive --format=tar.gz --prefix="tupperclaude-${version}/" \
            -o "tupperclaude-${version}.tar.gz" "$GITHUB_REF_NAME"
          echo "sha256=$(sha256sum "tupperclaude-${version}.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # Binds the tarball's digest to this repository, workflow and commit, in a
      # public transparency log. `gh attestation verify` is the whole client
      # side of it — nothing to download, no key to distribute.
      - name: Attest the tarball's provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: tupperclaude-${{ env.version }}.tar.gz

      - uses: sigstore/cosign-installer@v3

      # The same guarantee in a form that does not need the gh CLI or a GitHub
      # account to check. Keyless, so the certificate identity IS the proof:
      # verification pins the workflow that signed, not a key someone holds.
      - name: Sign the tarball
        run: |
          cosign sign-blob --yes \
            --bundle "tupperclaude-${version}.tar.gz.sigstore" \
            "tupperclaude-${version}.tar.gz"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "v${version}" \
            --generate-notes \
            "tupperclaude-${version}.tar.gz" \
            "tupperclaude-${version}.tar.gz.sigstore"

      # The tarball URL only resolves once the release exists, so the formula is
      # updated after it, not before.
      - name: Update the Homebrew tap
        env:
          # A PAT with contents:write on abossenbroek/homebrew-tupperclaude.
          # github.token is scoped to THIS repository and cannot push to the tap.
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -e
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_TOKEN is not set — the release exists but the tap still points at HEAD."
            echo "Add a PAT with contents:write on abossenbroek/homebrew-tupperclaude as the TAP_TOKEN secret."
            exit 0
          fi

          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/tupperclaude-${version}.tar.gz"

          # Insert the stable stanza above `head`, or replace an existing one.
          # `head` stays: `brew install --HEAD` must keep working after a release.
          python3 - "$url" "$sha256" "$version" <<'PY'
          import re, sys, pathlib
          url, sha, ver = sys.argv[1:4]
          p = pathlib.Path("Formula/tupperclaude.rb")
          s = p.read_text()
          stanza = f'  url "{url}"\n  version "{ver}"\n  sha256 "{sha}"\n'
          if re.search(r'^  url "', s, re.M):
              s = re.sub(r'^  url ".*"\n(  version ".*"\n)?  sha256 ".*"\n', stanza, s, count=1, flags=re.M)
          else:
              s = re.sub(r'^(  head .*\n)', stanza + r'\1', s, count=1, flags=re.M)
          assert url in s, "failed to write the stable stanza"
          p.write_text(s)
          PY

          # --branch main, not the default branch: the branch brew serves is a
          # property of the tap that can be changed in its settings, and a
          # release must not follow it silently.
          git clone -q --branch main \
            "https://x-access-token:${TAP_TOKEN}@github.com/abossenbroek/homebrew-tupperclaude.git" /tmp/tap
          cp Formula/tupperclaude.rb /tmp/tap/Formula/tupperclaude.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tupperclaude.rb
          if git diff --cached --quiet; then
            echo "tap already up to date"
          else
            git commit -q -m "formula: tupperclaude v${version}"
            git push -q
          fi
